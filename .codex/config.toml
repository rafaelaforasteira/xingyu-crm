# Project-local tools only. Inherits existing sandbox, approvals, model and MCPs.
[shell_environment_policy.set]
UV_PYTHON = 'C:\Users\Windows\.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
UV_PYTHON_DOWNLOADS = "never"

[mcp_servers.brainx_playwright]
command = "cmd.exe"
args = ["/d", "/c", "npx", "--yes", "@playwright/mcp@0.0.84", "--headless", "--isolated", "--executable-path", 'C:\Users\Windows\AppData\Local\ms-playwright\chromium-1248\chrome-win64\chrome.exe', "--block-service-workers", "--no-webmcp", "--allowed-origins", "http://127.0.0.1:3107;http://localhost:3107;http://127.0.0.1:3347", "--output-dir", ".temp/playwright-mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 60
enabled_tools = ["browser_tabs", "browser_navigate", "browser_snapshot", "browser_click", "browser_type", "browser_fill_form", "browser_press_key", "browser_select_option", "browser_resize", "browser_take_screenshot", "browser_console_messages", "browser_network_requests", "browser_close"]

