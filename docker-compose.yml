services:
  postgres:
    image: postgres:16-alpine
    container_name: xingyu-crm-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xingyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xingyu}
      POSTGRES_DB: ${POSTGRES_DB:-xingyu_crm}
    volumes:
      - xingyu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xingyu} -d ${POSTGRES_DB:-xingyu_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xingyu-crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - xingyu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xingyu_postgres_data:
  xingyu_redis_data:
